<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#11141c; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 16px 60px; font-family:'Poppins',sans-serif; font-feature-settings:"kern" 1; text-rendering:optimizeLegibility; }
  .toolbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px; background:rgba(17,20,28,.92); backdrop-filter:blur(6px); padding:12px 18px; border-radius:9px; margin-bottom:22px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .toolbar .label { color:#e0e0e0; font-weight:700; font-size:13px; }
  .toolbar .sub { color:rgba(255,255,255,.5); font-size:12.5px; }
  .dl-btn { background:#00bfa5; color:#002b26; font-family:'Poppins',sans-serif; font-weight:700; font-size:13px; padding:10px 20px; border-radius:20px; border:none; cursor:pointer; letter-spacing:.3px; transition:opacity .15s; }
  .dl-btn:hover { opacity:.85; }
  .dl-btn:focus-visible { outline:2px solid #fff; outline-offset:2px; }

  /* Modo exportación (#export): solo la pieza, sin toolbar — para render headless */

  body.export .toolbar { display:none; }
  body.export .ad { box-shadow:none; }

  .ad {
    width:1080px; height:1350px; position:relative; overflow:hidden; flex-shrink:0;
    background:#0d0d12; box-shadow:0 30px 80px rgba(0,0,0,.55);
  }

  /* Foto: 1080×1618 escalada, recortada al 4:5 desde y=228 (grúa arriba, obreros al centro) */
  .photo { position:absolute; left:0; top:-228px; width:1080px; height:1618px; display:block; }

  /* Velo superior: sostiene el titular sobre la celosía de la grúa; se abre antes del gancho */
  .veil-top { position:absolute; inset:0 0 auto 0; height:750px;
    background:linear-gradient(180deg, rgba(10,35,66,.97) 0%, rgba(10,35,66,.95) 66%, rgba(10,35,66,.5) 80%, rgba(10,35,66,0) 96%); }
  /* Velo inferior: base para el CTA sobre la malla verde */
  .veil-bottom { position:absolute; inset:auto 0 0 0; height:440px;
    background:linear-gradient(0deg, rgba(13,13,18,.97) 0%, rgba(13,13,18,.9) 45%, rgba(13,13,18,0) 100%); }

  .top { position:absolute; left:80px; right:80px; top:96px; }
  /* Titular en dos voces: Poppins blanco (qué) + Newsreader itálica teal (para quién) */
  h1 { font-family:'Poppins',sans-serif; font-weight:800; font-size:88px; line-height:1.02; letter-spacing:-.03em; color:#fff; }
  h1 .serif { display:block; margin-top:20px; font-family:'Newsreader',serif; font-style:italic; font-weight:500; font-variation-settings:"opsz" 72; font-size:76px; line-height:1.04; letter-spacing:-.015em; color:#00bfa5; }

  /* Firma: etiqueta colgada del gancho real de la grúa */
  .tag-wrap { position:absolute; left:599px; top:640px; transform-origin:0 0; transform:rotate(-5deg); }
  .tag-wrap .string { position:absolute; left:-1px; top:-6px; width:2px; height:82px; background:rgba(255,255,255,.85); }
  .tag {
    position:absolute; left:-155px; top:70px; width:310px;
    background:#fff; border-radius:14px; padding:32px 22px 20px; text-align:center;
    box-shadow:0 18px 30px rgba(0,0,0,.38);
  }
  .tag::before { content:''; position:absolute; left:50%; top:13px; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:#0a2342; }
  .tag .from { font-weight:600; font-size:19px; letter-spacing:.12em; text-transform:uppercase; color:#51616f; }
  .tag .main { font-weight:800; font-size:41px; line-height:1.02; letter-spacing:-.02em; color:#0a2342; margin-top:8px; }
  .tag .per { font-weight:600; font-size:19px; color:#33414c; margin-top:10px; }

  .bottom { position:absolute; left:80px; right:80px; bottom:76px; }
  .cta { display:inline-flex; align-items:center; gap:16px; background:#00bfa5; color:#002b26; font-weight:700; font-size:38px; padding:30px 50px; border-radius:999px; box-shadow:0 14px 30px rgba(0,0,0,.35); white-space:nowrap; }
  .terms { margin-top:22px; padding-left:50px; font-weight:500; font-size:24px; color:#e0e0e0; }
